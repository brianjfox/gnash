# CLA Assistant Lite: block pull requests until every contributor has signed
# the Contributor License Agreement (CLA.md).
#
# A contributor signs once by leaving a PR comment with the exact phrase:
#   I have read the CLA Document and I hereby sign the CLA
# Their GitHub username is then recorded in signatures/version1/cla.json and
# they are never asked again.  Re-comment "recreate-signatures" (maintainers)
# to rebuild the signature check.
#
# Signatures are stored in this repo on the dedicated `cla-signatures' branch,
# so the built-in GITHUB_TOKEN is enough -- no Personal Access Token or secret
# is required (a PAT is only needed to store signatures in a *separate* repo),
# and signature commits never touch the protected `main' branch.
#
# Setup required once: make the CLA check a required status check on `main' so
# pull requests cannot merge until it passes (its exact name is read off the
# first PR run).

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

# pull_request_target runs with the base-repo token so the bot can comment and
# record signatures even for pull requests opened from forks.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

# One run per PR at a time: a new push supersedes the queued run instead of
# piling up behind it.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fast path: the maintainer's own pull requests (and bots') never need a
      # signature -- succeed immediately instead of exercising the full CLA
      # action, whose slow/failing runs were leaving the required `cla' status
      # unreported and pull requests stuck at "expected".
      - name: Maintainer fast-path
        if: >-
          github.event_name == 'pull_request_target' &&
          (github.event.pull_request.user.login == 'brianjfox' ||
           endsWith(github.event.pull_request.user.login, '[bot]'))
        run: echo "Maintainer/bot pull request -- CLA not required."
      - name: CLA Assistant
        if: >-
          ((github.event.comment.body == 'recreate-signatures' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
           github.event_name == 'pull_request_target') &&
          !(github.event_name == 'pull_request_target' &&
            (github.event.pull_request.user.login == 'brianjfox' ||
             endsWith(github.event.pull_request.user.login, '[bot]')))
        # contributor-assistant/github-action is archived and its every release
        # declares `runs.using: node20', which GitHub is removing from Actions
        # runners (fall 2026).  Pinned by SHA to our fork of its v2.6.1 release
        # with only `action.yml' bumped to node24 -- the bundled dist/index.js
        # is unchanged.  See brianjfox/github-action, tag v2.6.1-node24.
        uses: brianjfox/github-action@d771e8b34a69d4395a6e3ac9ebe3bc219e3e1fea
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/brianjfox/gnash/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          # People who never need to sign (the maintainer, bots).
          allowlist: brianjfox,*[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution to gnash. Before it can be merged,
            please read our [Contributor License Agreement](https://github.com/brianjfox/gnash/blob/main/CLA.md)
            and sign it by posting a new comment on this pull request containing
            exactly the line below (nothing else):
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✍️ ✅'
